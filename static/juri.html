<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jüri İnceleme — NSosyal</title><link rel="stylesheet" href="/style.css?v=25"></head><body class="profile-body"><main class="profile-page"><header class="profile-topbar"><a class="round-button profile-back" href="/index.html">‹</a><b>Jüri inceleme</b><span></span></header><section class="profile-post-section"><span class="eyebrow">ŞEFFAF DUYGU KATMANI</span><h1 style="font-size:27px;letter-spacing:-.06em">Karar kanıtı</h1><p style="color:var(--muted);font-size:13px;line-height:1.5">Bu görünüm normal kullanıcı akışından ayrıdır. Sağlık teşhisi üretmez; yalnızca modelin akış dengeleme kararındaki sinyalleri gösterir.</p><div id="jury-data" class="jury-grid"><div class="loading-state">Teknik durum yükleniyor…</div></div></section></main><script>fetch('/api/juri-durum').then(r=>r.json()).then(d=>{const x=d.duygu_katmani;document.getElementById('jury-data').innerHTML=`<article><small>Veri yeterliliği</small><b>${x.veri_yeterli?'Yeterli':'Henüz değil'}</b><p>${x.anlamli_etkilesim} anlamlı etkileşim</p></article><article><small>Model güveni</small><b>%${Math.round(x.guven*100)}</b><p>Kalibrasyon: %${Math.round(x.kalibrasyon_guveni*100)}</p></article><article><small>Yoğunluk kanıtı</small><b>%${Math.round(x.akıs_yogunlugu*100)}</b><p>Negatif dwell: ${x.negatif_dwell} sn</p></article><article><small>Müdahale</small><b>${x.mudahale_uygun?'Uygun':'Uygun değil'}</b><p>${x.nedenler.join(' · ')||'Sürdürülebilir örüntü yok'}</p></article>`}).catch(()=>document.getElementById('jury-data').textContent='Durum yüklenemedi.')</script><style>.jury-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.jury-grid article{padding:15px;border-radius:19px;background:#f1f4ed}.jury-grid small{display:block;color:#687661;font-size:10px}.jury-grid b{display:block;margin-top:8px;font-size:20px}.jury-grid p{margin:6px 0 0;color:#68726b;font-size:11px;line-height:1.4}@media(max-width:420px){.jury-grid{grid-template-columns:1fr}}</style></body></html>
